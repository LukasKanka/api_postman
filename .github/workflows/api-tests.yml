name: Run Postman API Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create .env, Install dependencies and start Backend
        run: |
          cd web/backend
          echo "PORT=3000" > .env
          npm install
          node app.js > server.log 2>&1 &

      - name: Wait for Backend server to be ready
        run: |
          echo "Čekám na naběhnutí serveru..."
          until curl -s http://127.0.0.1:3000 > /dev/null; do
            sleep 1
          done
          echo "Server běží a odpovídá!"

      # Instalace htmlextra reporteru a spuštění testů s generováním HTML
      - name: Run Postman API Tests with HTML Report
        run: |
          cd apiTest
          npm install -g newman newman-reporter-htmlextra
          newman run PotterAPI.postman_collection.json -e environment.json -r htmlextra --reporter-htmlextra-export report.html

      # Uložení reportu jako artefaktu v GitHubu (spustí se vždy, i při selhání testů)
      - name: Upload HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-html-report
          path: apiTest/report.html
          retention-days: 7
